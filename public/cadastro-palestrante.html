<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de palestrante | Gerenciador de eventos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <a href="index.html" class="logo">Gerenciador de eventos</a>
    <nav class="menu" aria-label="Menu principal">
      <a href="cadastro-palestrante.html" class="ativo" aria-current="page">Cadastro de palestrantes</a>
      <a href="cadastro-evento.html">Cadastro de evento</a>
      <a href="index.html">Gerenciador de evento</a>
    </nav>
  </header>

  <main class="conteudo">
    <h1 class="titulo">Cadastro palestrante</h1>

    <!-- novalidate: quem valida é o nosso JavaScript, com mensagens em português -->
    <form id="form-palestrante" class="formulario" novalidate>
      <div class="campo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" maxlength="100" autocomplete="name" aria-describedby="erro-nome">
        <span class="erro" id="erro-nome" aria-live="polite"></span>
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" maxlength="150" autocomplete="email" aria-describedby="erro-email">
        <span class="erro" id="erro-email" aria-live="polite"></span>
      </div>

      <button type="submit" class="botao botao-principal">Cadastrar</button>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/cadastro-palestrante.js"></script>
</body>
</html>
