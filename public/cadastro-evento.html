<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de evento | Gerenciador de eventos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <a href="index.html" class="logo">Gerenciador de eventos</a>
    <nav class="menu" aria-label="Menu principal">
      <a href="cadastro-palestrante.html">Cadastro de palestrantes</a>
      <a href="cadastro-evento.html" class="ativo" aria-current="page">Cadastro de evento</a>
      <a href="index.html">Gerenciador de evento</a>
    </nav>
  </header>

  <main class="conteudo">
    <!-- O título muda para "Editar evento" quando a tela abre em modo edição -->
    <h1 class="titulo" id="titulo-pagina">Cadastro de evento</h1>

    <p id="sem-palestrantes" class="aviso" hidden>
      Nenhum palestrante cadastrado. Para criar um evento,
      <a href="cadastro-palestrante.html">cadastre um palestrante</a> primeiro.
    </p>

    <form id="form-evento" class="formulario" novalidate>
      <div class="campo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" maxlength="100" aria-describedby="erro-nome">
        <span class="erro" id="erro-nome" aria-live="polite"></span>
      </div>

      <div class="campo">
        <label for="descricao">Descrição</label>
        <input type="text" id="descricao" name="descricao" maxlength="255" aria-describedby="erro-descricao">
        <span class="erro" id="erro-descricao" aria-live="polite"></span>
      </div>

      <div class="campo">
        <label for="local">Local</label>
        <input type="text" id="local" name="local" maxlength="150" aria-describedby="erro-local">
        <span class="erro" id="erro-local" aria-live="polite"></span>
      </div>

      <div class="campo">
        <label for="palestrante">Palestrante</label>
        <!-- As opções vêm do banco de dados (preenchidas pelo JavaScript) -->
        <select id="palestrante" name="palestrante" aria-describedby="erro-palestrante"></select>
        <span class="erro" id="erro-palestrante" aria-live="polite"></span>
      </div>

      <button type="submit" class="botao botao-principal" id="botao-cadastrar">Cadastrar</button>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/cadastro-evento.js"></script>
</body>
</html>
